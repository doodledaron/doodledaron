<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Processing Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Document Processing Platform (Demo)</h1>
    </header>

    <nav id="document-selector">
        <h2>Select a Document</h2>
        <!-- Document selection buttons will be added here by script.js -->
    </nav>

    <main>
        <section id="document-display">
            <h2>Document Content</h2>
            <div id="document-content-placeholder">
                <p>Select a document to view its content here.</p>
            </div>
        </section>

        <section id="summary-display">
            <h2>Summary</h2>
            <div id="summary-content-placeholder">
                <p>Summary will appear here.</p>
            </div>
        </section>

        <section id="insights-display">
            <h2>Insights & Next Steps</h2>
            <div id="insights-content-placeholder">
                <p>Insights and next steps will appear here.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Document Processing Demo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
